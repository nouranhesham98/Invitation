    <script>
        // ... existing code ...
        async function fetchStats() {
            const GOOGLE_SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";
            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getStats`);
                const data = await response.json();
                document.getElementById('stat-attending').innerText = data.attending;
                document.getElementById('stat-guests').innerText = data.guests;
            } catch (err) {
                console.error("Error fetching stats:", err);
                alert("يرجى التأكد من ربط رابط Google Script الصحيح");
            }
        }
        // ... existing code ...
    </script>
