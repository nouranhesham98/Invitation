<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف - Mostafa & Nouran</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { 100: '#fcf8ec', 300: '#e5d1a5', 500: '#b89753', 600: '#9b7b3c', 700: '#765d2a' },
                        sage: { 50: '#f4f6f3', 100: '#e2e8df', 600: '#5c7356' },
                        cream: '#f9f6f0',
                        darkGreen: '#2d382b'
                    },
                    fontFamily: { arabic: ['Cairo', 'sans-serif'], classic: ['Amiri', 'serif'], script: ['Alex Brush', 'cursive'] }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f3efe6; color: #3b3a36; overflow-x: hidden; }
        #intro-overlay { position: fixed; inset: 0; background: linear-gradient(135deg, #f7f4ee 0%, #e8e2d5 100%); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 1s ease-in-out, visibility 1s; }
        .card-frame { border: 2px solid #d4be93; box-shadow: 0 20px 40px rgba(0,0,0,0.08); background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); position: relative; }
        .card-frame::after { content: ''; position: absolute; inset: 6px; border: 1px solid rgba(212, 190, 147, 0.5); pointer-events: none; }
        .pulse-recording { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="min-h-screen relative flex justify-center items-center p-0 sm:p-4">

    <div id="intro-overlay">
        <div class="relative text-center p-8 max-w-sm w-full mx-4 card-frame bg-white/95 py-14 shadow-2xl">
            <h2 class="font-classic text-2xl text-darkGreen mb-1">دعوة زفاف مباركة</h2>
            <p class="font-script text-4xl text-gold-600 mb-8">Mostafa & Nouran</p>
            <button onclick="openInvitation()" class="px-8 py-3 bg-gradient-to-r from-gold-500 to-gold-600 text-white font-bold rounded-full shadow-lg transition-all transform hover:-translate-y-0.5">فتح الدعوة</button>
        </div>
    </div>

    <main class="w-full max-w-md bg-white/90 backdrop-blur-md shadow-2xl rounded-none sm:rounded-2xl my-0 sm:my-6 overflow-hidden relative z-20">
        <div class="p-4 sm:p-6 space-y-6">
            <section class="card-frame pt-6 pb-5 px-6 text-center rounded-lg">
                <h1 class="font-script text-5xl text-gold-700 font-bold">Mostafa & Nouran</h1>
                <p class="font-classic text-sm text-gray-500 mt-2">٤ سبتمبر ٢٠٢٦ — Katameya Gardens</p>
            </section>

            <section class="bg-white rounded-xl p-5 shadow-sm border border-gold-200/60">
                <h3 class="font-bold text-base text-darkGreen mb-4 text-center">تأكيد الحضور</h3>
                <form id="rsvp-form" onsubmit="handleRSVP(event)" class="space-y-3">
                    <input type="text" id="guest-name" required placeholder="اسمك الكريم" class="w-full px-3 py-2 rounded-lg border text-xs">
                    <div class="grid grid-cols-2 gap-2">
                        <button type="submit" onclick="setAttendance(true)" class="py-2.5 bg-darkGreen text-white rounded-lg font-bold text-xs">سأحضر</button>
                        <button type="submit" onclick="setAttendance(false)" class="py-2.5 bg-gray-100 text-gray-600 rounded-lg font-bold text-xs">أعتذر</button>
                    </div>
                </form>
            </section>

            <section id="memory-section" class="bg-white rounded-xl p-5 shadow-sm border border-gold-200/60 hidden">
                <h3 class="font-bold text-base text-darkGreen mb-4 text-center">اترك بصوتك تهنئة</h3>
                <div class="flex flex-col items-center gap-3">
                    <button id="record-btn" onclick="toggleRecording()" class="w-16 h-16 rounded-full bg-gold-600 text-white text-xl flex items-center justify-center">
                        <i id="record-icon" class="fa-solid fa-microphone"></i>
                    </button>
                    <p id="record-status" class="text-xs text-gray-500">اضغط للبدء</p>
                    <audio id="audio-preview" controls class="hidden w-full"></audio>
                </div>
            </section>
        </div>
    </main>

    <script>
        function openInvitation() { document.getElementById('intro-overlay').style.opacity = '0'; setTimeout(() => document.getElementById('intro-overlay').style.display = 'none', 1000); }
        function handleRSVP(e) { e.preventDefault(); document.getElementById('memory-section').classList.remove('hidden'); alert('شكراً لتأكيد حضورك!'); }
        
        let mediaRecorder, audioChunks = [];
        async function toggleRecording() {
            const btn = document.getElementById('record-btn');
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    document.getElementById('audio-preview').src = URL.createObjectURL(blob);
                    document.getElementById('audio-preview').classList.remove('hidden');
                };
                mediaRecorder.start();
                btn.classList.add('pulse-recording');
            } else {
                mediaRecorder.stop();
                btn.classList.remove('pulse-recording');
            }
        }
    </script>
</body>
</html>
