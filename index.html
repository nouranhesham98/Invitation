<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mostafa & Nouran - Tropical Garden Wedding</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "demo-key",
      authDomain: "demo-project.firebaseapp.com",
      projectId: "demo-project",
      storageBucket: "demo-project.appspot.com",
      messagingSenderId: "123456",
      appId: "1:123456:web:123456"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.db = db;
    window.auth = auth;

    signInAnonymously(auth);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.currentUser = user;
        listenToCloudData();
      }
    });

    function listenToCloudData() {
      const q = query(collection(db, 'wishes'), orderBy('timestamp', 'desc'));
      onSnapshot(q, (snapshot) => {
        const wishes = [];
        snapshot.forEach((doc) => wishes.push({ id: doc.id, ...doc.data() }));
        window.cloudWishes = wishes;
        if (window.isAdminViewOpen) window.renderAdminData();
      });
    }

    window.saveToCloud = async function(data) {
      await addDoc(collection(db, 'wishes'), { ...data, timestamp: Date.now() });
    };
  </script>

  <style>
    .font-serif-ar { font-family: 'Amiri', serif; }
    .font-sans-ar { font-family: 'Cairo', sans-serif; }
    .font-alex { font-family: 'Alex Brush', cursive; }
    .wax-seal { box-shadow: 0 8px 25px rgba(0,0,0,0.35); }
    .glass-card { background: rgba(255, 255, 255, 0.93); backdrop-filter: blur(14px); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-[#18231F] text-[#2C3E35] font-sans-ar min-h-screen flex justify-center items-center p-0 md:p-4">

  <div class="w-full max-w-md h-screen md:h-[844px] bg-[#FAF7F2] relative shadow-2xl md:rounded-[40px] overflow-hidden flex flex-col border-[8px] border-[#24332C]">
    
    <!-- ENVELOPE -->
    <div id="envelopeCover" class="absolute inset-0 z-50 bg-[#F4EFEA] flex flex-col items-center justify-center p-6">
      <h2 class="font-alex text-5xl text-[#2C3E35]">Mostafa & Nouran</h2>
      <button onclick="document.getElementById('envelopeCover').classList.add('hidden')" class="mt-10 w-24 h-24 rounded-full bg-[#D4AF37] wax-seal flex items-center justify-center text-white font-alex text-2xl">
        فتح
      </button>
    </div>

    <!-- CONTENT -->
    <div class="flex-1 overflow-y-auto p-6 space-y-6">
      <h1 class="text-3xl font-alex text-center">دعوة زفاف</h1>
      <p class="text-center font-serif-ar">يسعدنا حضوركم في حفل زفافنا</p>
      
      <div id="adminArea" class="mt-10 border-t pt-4">
         <button onclick="promptAdminLogin()" class="text-xs text-gray-400">لوحة التحكم</button>
      </div>
    </div>
  </div>

  <!-- ADMIN MODAL -->
  <div id="adminModal" class="hidden fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-2xl w-full max-w-sm">
      <input type="password" id="adminPassword" placeholder="كلمة المرور" class="w-full p-2 border rounded mb-4">
      <button onclick="verifyAdmin()" class="w-full bg-[#24332C] text-white p-2 rounded">دخول</button>
    </div>
  </div>

  <script>
    function promptAdminLogin() { document.getElementById('adminModal').classList.remove('hidden'); }
    function verifyAdmin() {
      if (document.getElementById('adminPassword').value === '2026') {
        document.getElementById('adminModal').classList.add('hidden');
        window.isAdminViewOpen = true;
        alert('مرحباً بك في لوحة التحكم');
      }
    }
  </script>
</body>
</html>
