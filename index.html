<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف - Mostafa & Nouran</title>
    <!-- تحميل Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&family=Alex+Brush&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f3efe6; }
        .hidden-admin { display: none; }
        .card-style { background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 20px; text-align: center; }
    </style>
</head>
<body class="p-4 flex flex-col items-center justify-center min-h-screen">

    <!-- كارت الدعوة الرئيسي -->
    <main class="card-style w-full max-w-sm">
        <h1 class="text-5xl font-bold text-yellow-700 font-script">Mostafa</h1>
        <div class="text-2xl text-yellow-500 my-2">&</div>
        <h1 class="text-5xl font-bold text-yellow-700 font-script">Nouran</h1>
        <p class="mt-4 text-lg">يسعدنا حضوركم في</p>
        <div class="font-bold text-green-900 text-xl">Katameya Gardens</div>
        
        <form id="rsvp-form" class="mt-6 space-y-3">
            <input type="text" id="guest-name" placeholder="أدخل اسمك الكريم" class="w-full p-2 border rounded-lg text-right">
            <button type="submit" class="w-full bg-green-900 text-white p-2 rounded-lg font-bold">تأكيد الحضور</button>
        </form>
    </main>

    <!-- زر الأدمن في الأسفل -->
    <button onclick="document.getElementById('admin-panel').classList.remove('hidden-admin')" class="mt-8 text-gray-400 text-xs underline">
        لوحة تحكم العروسين
    </button>

    <!-- لوحة الأدمن (مخفية) -->
    <div id="admin-panel" class="hidden-admin mt-4 p-4 bg-white rounded-lg shadow-lg w-full max-w-sm">
        <h3 class="font-bold mb-2">دخول لوحة التحكم</h3>
        <input type="password" id="admin-pass" placeholder="كلمة المرور" class="w-full p-2 border rounded-lg mb-2">
        <div class="flex gap-2">
            <button onclick="checkAdmin()" class="bg-yellow-600 text-white px-4 py-2 rounded-lg">دخول</button>
            <button onclick="document.getElementById('admin-panel').classList.add('hidden-admin')" class="bg-gray-200 px-4 py-2 rounded-lg">إغلاق</button>
        </div>
        <div id="stats" class="mt-4 text-right hidden">
            <p>إجمالي الحضور: <span id="stat-attending">0</span></p>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "Yhttps://script.google.com/macros/s/AKfycbzEsSLKxLLX6JAtVqYPqtJ4p2xOMKw0d1_I7a5tgsJ1ZSPWwo5G9ffSxEjOugQA0tc/exec";

        async function checkAdmin() {
            const pass = document.getElementById('admin-pass').value;
            if(pass === "1234") {
                const response = await fetch(GOOGLE_SCRIPT_URL + "?action=getStats");
                const data = await response.json();
                document.getElementById('stat-attending').innerText = data.attending;
                document.getElementById('stats').classList.remove('hidden');
            } else {
                alert("كلمة مرور خاطئة");
            }
        }
    </script>
</body>
</html>
